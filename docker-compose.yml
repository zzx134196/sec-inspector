# ============================================
#  等保测评助手 - Docker Compose 一键部署
#  用法: docker compose up -d
# ============================================
version: '3.8'

services:
  # ---------- 前端（Nginx 生产模式） ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sec-inspector-frontend
    ports:
      - "${FRONTEND_PORT:-8003}:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ---------- 后端 API ----------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sec-inspector-backend
    ports:
      - "${BACKEND_PORT:-8021}:8021"
    volumes:
      - backend_data:/app/data               # SQLite数据库持久化
      - ./data/uploads:/app/uploads
      - ./data/exports:/app/exports
    environment:
      - DATABASE_URL=sqlite:///./data/sec_inspector.db
      - LLM_BASE_URL=${LLM_BASE_URL:-http://192.168.1.100:18888/v1}
      - LLM_API_KEY=${LLM_API_KEY:-gpustack_cd9723bca82e5e9e_a9b7da5f0badf8ad9568d5275624847c}
      - LLM_MODEL=${LLM_MODEL:-DeepSeek-R1}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-4096}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.7}
      - NVD_API_KEY=${NVD_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  backend_data:
